schema = 1
project = "cfrg"

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"
# Locked: Cargo.lock is worker-resolved (see S-split/CI-NOTES.md); the
# pinned tool passes --locked to every cargo invocation.
[checks.test]
kind = "cargo"

[checks.build]
kind = "cargo"
actions = ["build"]
release = true

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["test"]
workflow = "ci"
command = ["bash", ".ci/run-job.sh"]
events = ["manual"]

[jobs.build]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["build"]
workflow = "build"
command = ["bash", ".ci/run-job.sh"]
events = ["manual"]

# Publishes the binary built from this exact commit to the forge's package
# registry (`cfrg release`): immutable per commit, fetched by URL and hash.
# Needs CFRG_RELEASE_TOKEN in the trusted scheduler environment.
[checks.publish]
kind = "commands"
# Never cached: a release must run, and only an uncached check receives the job's
# CI_COMMIT_SHA (the build embeds it) and the declared secret environment.
cache = false
commands = [["cargo", "run", "--release", "--locked", "-p", "cfrg-cli", "--", "release", "--config", ".ci/release.json", "publish", "--self"]]

# The release job (registry token) is retired from the scheduler until a Forgejo-native
# release flow exists (manual unit with a sealed credential); the check stays declared.
