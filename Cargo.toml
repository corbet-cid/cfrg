[workspace]
resolver = "2"
members = ["cfrg", "cfrg-relay", "cfrg-cli", "cfrg-serve", "clmr"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[workspace.dependencies]
cqlt = { git = "https://git.corbet.ch/corbet-cid/cqlt", rev = "0849b9721947eac943e121204a02129b6dd4bedd" }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
cfrg = { path = "cfrg" }
clmr = { path = "clmr" }
cfgj = { git = "https://git.corbet.ch/corbet-libre/cfgj", rev = "ea6e029af7a5593bb5a79499f0fe4e9ed4789b49" }
cglb = { git = "https://git.corbet.ch/corbet-libre/cglb", rev = "dbfa6fa64714f9598d7da71fce6811f4ba05933c" }
cbkt = { git = "https://git.corbet.ch/corbet-libre/cbkt", rev = "53441c2669a03f96772827fb81a16d397cdfea0f" }
cghb = { git = "https://git.corbet.ch/corbet-libre/cghb", rev = "cbe36b82947c6ffc7e9951b8416d3f7d5083b4ca" }
cfrg-relay = { path = "cfrg-relay" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The driver repositories depend on cfrg by git revision; one cfrg for the whole graph.
[patch."https://git.corbet.ch/corbet-cid/cfrg"]
cfrg = { path = "cfrg" }
