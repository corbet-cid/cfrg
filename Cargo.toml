[workspace]
resolver = "2"
members = ["cfrg", "cfrg-cli", "cfgj", "cglb", "cbkt", "cghb", "clmr"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
cqlt = { git = "https://git.corbet.ch/corbet-cid/cqlt", rev = "0849b9721947eac943e121204a02129b6dd4bedd" }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
cfrg = { path = "cfrg" }
clmr = { path = "clmr" }
cfgj = { path = "cfgj" }
cglb = { path = "cglb" }
cbkt = { path = "cbkt" }
cghb = { path = "cghb" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
