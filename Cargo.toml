[workspace]
resolver = "2"
members = ["cfrg", "cfrg-relay", "cfrg-cli", "cfrg-serve", "clmr"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[workspace.dependencies]
cqlt = { git = "https://git.corbet.ch/corbet-cid/cqlt", rev = "0849b9721947eac943e121204a02129b6dd4bedd" }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
process-wrap = { version = "10.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
cfrg = { path = "cfrg" }
clmr = { path = "clmr" }
cfgj = { git = "https://git.corbet.ch/corbet-libre/cfgj", rev = "044d3d9fb939f9d44086e05c75b08fca86c7732b" }
cglb = { git = "https://git.corbet.ch/corbet-libre/cglb", rev = "8693ec9f251a5393ef593e1f14de558be74aae42" }
cbkt = { git = "https://git.corbet.ch/corbet-libre/cbkt", rev = "447ddb037f6d9ddc3e1be74573c7cbdffe07e54d" }
cghb = { git = "https://git.corbet.ch/corbet-libre/cghb", rev = "b89dff96a25f86b1de2c240d2a7b0239c4e4fac6" }
cfrg-relay = { path = "cfrg-relay" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The driver repositories depend on cfrg by git revision; one cfrg for the whole graph.
[patch."https://git.corbet.ch/corbet-cid/cfrg"]
cfrg = { path = "cfrg" }
